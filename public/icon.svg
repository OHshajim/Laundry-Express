<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88C7" />
      <stop offset="100%" stop-color="#141B2E" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#B9E1F5" />
      <stop offset="100%" stop-color="#1E88C7" />
    </linearGradient>
    <linearGradient id="capeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D63A3A" />
      <stop offset="100%" stop-color="#A82525" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield / Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Superhero Cape Flap -->
  <path d="M12 28 C8 42, 14 54, 22 56 C16 48, 14 38, 18 26 Z" fill="url(#capeGrad)" />

  <!-- Main Hero Bubble Body -->
  <circle cx="34" cy="32" r="18" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="2" />

  <!-- Bubble Gloss Reflection Highlight -->
  <ellipse cx="28" cy="24" rx="5" ry="2.5" transform="rotate(-30 28 24)" fill="#FFFFFF" opacity="0.85" />

  <!-- Superhero Hero Mask / Emblem -->
  <path d="M24 30 Q34 26 44 30 Q39 36 34 33 Q29 36 24 30 Z" fill="#141B2E" />

  <!-- Hero Eyes -->
  <ellipse cx="29" cy="30.5" rx="1.8" ry="1.2" fill="#FFFFFF" />
  <ellipse cx="39" cy="30.5" rx="1.8" ry="1.2" fill="#FFFFFF" />

  <!-- Superhero Energy Spark (Hero Amber) -->
  <polygon points="46,14 48,20 54,22 48,24 46,30 44,24 38,22 44,20" fill="#F5A623" />
  <circle cx="16" cy="18" r="3" fill="#B9E1F5" opacity="0.7" />
  <circle cx="48" cy="46" r="2.5" fill="#B9E1F5" opacity="0.6" />
</svg>
